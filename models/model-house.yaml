schema_version: 1
policy: pin_every_model_by_source_checksum_runtime_and_license
artifacts_root: external://approved-model-storage
endpoints:
  - id: omniroute-local
    family: gateway
    purpose: provider_routing_compression_mcp_a2a
    protocol: openai_compatible
    base_url: http://127.0.0.1:20128/v1
    host: macbook_or_linux_vm
    status: candidate_requires_isolated_test
    notes: "Candidate MIT gateway. Keep bound to localhost/private Tailscale; verify provider credentials, compression fidelity and MCP scopes before production."
  - id: jev-style-local
    family: jev-style
    purpose: system-1_decision_routing
    protocol: local_http
    base_url: http://127.0.0.1:8009
    launch_command: "jev-style serve --release 2b --precision 8bit --backend mlx"
    host: macbook
    status: verified_local
    notes: "Qwen3.5-derived 2B MLX 8-bit service; roughly 2-3.8 GB depending on build. The 0.8B release is roughly 1.5 GB. Use for routing/decision support, not general chat."
  - id: laya
    family: laya
    purpose: system-1_choice_score_routing
    protocol: pending
    host: pending
    status: candidate_not_installed
    notes: "Non-autoregressive decision model. English and typed-decision checkpoints are about 421M parameters; multilingual is about 322M. Exact checkpoint and endpoint must be pinned before use."
  - id: qwen-candidate
    family: qwen-alibaba
    purpose: local_coding_and_reasoning
    protocol: ollama_or_openai_compatible
    host: pending
    status: candidate_requires_review
    notes: "Qwen3 ranges from 0.6B to 32B dense and 30B-A3B/235B-A22B MoE. Do not use a community 'uncensored' tag as provenance. Record exact model, license, hash, modalities and tool tests."
  - id: deepseek-harness
    family: deepseek-harness
    purpose: provider_neutral_orchestration
    protocol: openai_or_anthropic_compatible
    host: pending
    status: experimental_not_installed
    notes: "Harness, not a model. DeepSeek-V3 is 671B total/37B active and is not a MacBook model; distilled 1.5B-70B variants are the local candidates. Run the harness in a least-privilege VM and connect through an adapter."
  - id: lfm-local
    family: liquid-lfm
    purpose: low_latency_local_worker
    protocol: ollama_or_gguf_or_vendor_runtime
    host: macbook
    status: candidate_requires_benchmark
    notes: "LFM2.5 includes small text, thinking, vision and audio families. Check the specific checkpoint and commercial terms before client use."
  - id: perplexity-local
    family: pplx-portable
    purpose: local_orchestrator_and_search
    protocol: vendor_runtime
    host: supported_nvidia_or_amd_machine
    status: candidate_not_macbook_target
    notes: "Perplexity Portable Computer advertises local PPLX/Qwen models on supported NVIDIA/AMD hardware; Sonar remains a hosted/API service."

routing:
  decision_model: jev-style-local
  default_chat_model: pending
  multimodal_model: pending
  fallback: pending
  rule: "Agents call an adapter; adapters expose health, model_id, checksum, modality and token usage."
